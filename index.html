<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#142d46">
<title>John Johnston | New World Sapiens</title>
<style>
:root{color-scheme:light;--navy:#142d46;--ink:#202b35;--muted:#687783;--line:#e3e9ed;--bg:#f3f6f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:24px}
main{width:min(100%,430px);background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 18px 55px #142d4612}
.top{height:12px;background:var(--navy)}.content{padding:36px 30px 30px;text-align:center}
.mark{width:68px;height:68px;margin:0 auto 22px;border-radius:50%;background:#eef3f6;color:var(--navy);display:grid;place-items:center;font-size:24px;font-weight:700;letter-spacing:.04em}
h1{font-size:30px;line-height:1.15;margin:0;color:var(--navy);letter-spacing:-.03em}
.org{margin:10px 0 28px;color:var(--muted);font-weight:600}
.actions{display:grid;gap:12px;margin:24px 0}
a.btn{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 16px;border-radius:12px;text-decoration:none;font-weight:650}
.primary{background:var(--navy);color:white}.secondary{border:1px solid var(--line);color:var(--navy);background:white}
.details{border-top:1px solid var(--line);margin-top:28px;padding-top:20px;text-align:left}
.detail{padding:11px 0}.label{font-size:11px;letter-spacing:.12em;color:#87939c;font-weight:750}.value{font-size:16px;overflow-wrap:anywhere;margin-top:3px}
footer{padding:16px;text-align:center;color:#98a3aa;font-size:12px;background:#fbfcfd}
</style>
</head>
<body>
<main>
 <div class="top"></div>
 <section class="content">
  <div class="mark" aria-hidden="true">JJ</div>
  <h1>John Johnston</h1>
  <div class="org">New World Sapiens</div>
  <div class="actions">
   <a class="btn primary" href="john-johnston.vcf" download>＋ Save Contact</a>
   <a class="btn secondary" href="tel:0220241567">☎ Call John</a>
   <a class="btn secondary" href="mailto:johnrjohnston@outlook.com">✉ Email John</a>
  </div>
  <div class="details">
   <div class="detail"><div class="label">PHONE</div><div class="value"><a href="tel:0220241567" style="color:inherit;text-decoration:none">0220241567</a></div></div>
   <div class="detail"><div class="label">EMAIL</div><div class="value"><a href="mailto:johnrjohnston@outlook.com" style="color:inherit;text-decoration:none">johnrjohnston@outlook.com</a></div></div>
  </div>
 </section>
 <footer>New World Sapiens · Digital Business Card</footer>
</main>
</body>
</html>
